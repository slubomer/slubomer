name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Kroky sa spustia, len ak daná časť projektu existuje.
      - name: Set up Python
        if: hashFiles('backend/pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend lint and tests
        if: hashFiles('backend/pyproject.toml') != ''
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          ruff check .
          ruff format --check .
          pytest

      - name: Frontend lint and tests
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test --if-present
